<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لا يوجد اتصال بالإنترنت</title>
<style>
  :root{
    --paper:#F4F0E6; --ink:#211F1A; --wood:#B4703A; --line: rgba(33,31,26,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Tajawal', 'Segoe UI', sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; text-align:center;
  }
  .wrap{max-width:360px;}
  .icon{
    width:72px; height:72px; border-radius:20px; background:var(--wood); color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:32px;
  }
  h1{font-size:20px; margin-bottom:10px; font-weight:800;}
  p{font-size:15px; line-height:1.7; color:#5a564d; margin-bottom:24px;}
  button{
    background:var(--wood); color:#fff; border:none; border-radius:12px; padding:13px 28px;
    font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  button:active{opacity:0.85;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من اتصالك بالإنترنت (واي فاي أو بيانات الجوال) ثم حاول مرة أخرى.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
